<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a question for you 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush: #ffe5ec;
    --cream: #fff9fb;
    --bubblegum: #ff6b9d;
    --bubblegum-dark: #e8478a;
    --plum: #5c3a56;
    --gold: #ffd166;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% 0%, var(--blush) 0%, #ffd1de 55%, #ffb8cd 100%);
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .hearts-bg{
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .heart{
    position: absolute;
    bottom: -10%;
    font-size: 22px;
    color: rgba(255,255,255,0.55);
    animation: floatUp linear infinite;
    user-select: none;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) rotate(0deg); opacity: 0; }
    10%{ opacity: 1; }
    100%{ transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  .stage{
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card{
    background: var(--cream);
    border-radius: 28px;
    padding: 44px 36px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(232,71,138,0.25), 0 2px 0 rgba(255,255,255,0.8) inset;
    position: relative;
    animation: cardIn 0.7s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes cardIn{
    0%{ transform: scale(0.7) translateY(30px); opacity: 0; }
    100%{ transform: scale(1) translateY(0); opacity: 1; }
  }

  .eyebrow{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    color: var(--bubblegum-dark);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 13px;
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    color: var(--plum);
    font-size: clamp(28px, 7vw, 38px);
    line-height: 1.15;
    margin: 0 0 8px;
  }

  .sub{
    color: #9c7a95;
    font-size: 15px;
    margin: 0 0 30px;
    font-weight: 500;
  }

  .polaroid{
    position: relative;
    display: inline-block;
    background: white;
    padding: 10px 10px 34px;
    border-radius: 10px;
    box-shadow: 0 14px 30px rgba(232,71,138,0.28), 0 2px 0 rgba(255,255,255,0.9) inset;
    transform: rotate(-6deg);
    margin-bottom: 14px;
    animation: floatTilt 3.4s ease-in-out infinite;
  }
  @keyframes floatTilt{
    0%,100%{ transform: rotate(-6deg) translateY(0); }
    50%{ transform: rotate(-2deg) translateY(-8px); }
  }
  .polaroid img{
    display: block;
    width: 190px;
    height: 190px;
    object-fit: cover;
    border-radius: 4px;
  }
  .polaroid .cap{
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--bubblegum-dark);
  }
  .polaroid .sticker{
    position: absolute;
    top: -14px;
    right: -14px;
    font-size: 30px;
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }

  .buttons{
    position: relative;
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    min-height: 70px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  button{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 16px 30px;
    font-size: 17px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, padding 0.2s ease, font-size 0.2s ease;
  }

  #yesBtn{
    background: linear-gradient(135deg, var(--bubblegum), var(--bubblegum-dark));
    color: white;
    box-shadow: 0 10px 20px rgba(232,71,138,0.4);
  }
  #yesBtn:active{ transform: scale(0.95); }

  #noBtn{
    background: #f4e6ee;
    color: #b988a6;
    position: relative;
  }
  #noBtn.dodging{
    position: fixed;
  }

  .msg{
    margin-top: 18px;
    font-size: 13px;
    color: #c48fac;
    min-height: 18px;
    font-weight: 600;
  }

  .celebrate{
    position: fixed; inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 30%, #fff0f5 0%, #ffcfe1 60%, #ffb0cf 100%);
  }
  .celebrate.show{ display: flex; }
  .celebrate-inner{
    animation: popIn 0.6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes popIn{
    0%{ transform: scale(0.5); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .celebrate h2{
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(30px, 8vw, 48px);
    color: var(--bubblegum-dark);
    margin: 0 0 12px;
  }
  .celebrate p{
    color: var(--plum);
    font-size: 17px;
    font-weight: 500;
    max-width: 340px;
    margin: 0 auto;
  }
  .love-text{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 34px);
    color: var(--bubblegum-dark);
    margin: 14px 0 6px;
    opacity: 0;
    transform: translateY(14px) scale(0.9);
    animation: loveIn 0.9s ease 0.4s forwards, loveBeat 1.6s ease-in-out 1.3s infinite;
  }
  @keyframes loveIn{
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes loveBeat{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }
  @keyframes beat{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.15); }
  }

  .confetti{
    position: fixed;
    top: -10%;
    z-index: 6;
    font-size: 20px;
    animation: fall linear forwards;
    pointer-events: none;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }

  @media (prefers-reduced-motion: reduce){
    .heart, .card, .celebrate-inner, .confetti{
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="stage">
  <div class="card">
    <p class="eyebrow">a very important question</p>
    <div class="polaroid">
      <span class="sticker">💘</span>
      <img src="photo.jpeg" alt="us">
      <div class="cap">us :)</div>
    </div>
    <h1>Will you be my future destiny?</h1>
    <p class="sub">take your time... (the "no" button is a little shy)</p>

    <div class="buttons" id="buttonsRow">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No</button>
    </div>

    <p class="msg" id="msg">&nbsp;</p>
  </div>
</div>

<div class="celebrate" id="celebrate">
  <div class="celebrate-inner">
    <div class="polaroid" style="transform: rotate(4deg);">
      <span class="sticker">💖</span>
      <img src="photo.jpeg" alt="us">
      <div class="cap">our destiny 🥹</div>
    </div>
    <h2>Yay!! She said yes!</h2>
    <p class="love-text">I love You Nandi🥹</p>
    <p>Best decision you've made all year. I'm so happy right now, I might actually be smiling through the screen. 🥹</p>
  </div>
</div>

<script>
  const heartsBg = document.getElementById('heartsBg');
  const heartEmojis = ['💗','💖','💕','💓','🩷'];
  for(let i=0;i<18;i++){
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*20) + 'px';
    h.style.animationDuration = (7 + Math.random()*8) + 's';
    h.style.animationDelay = (Math.random()*8) + 's';
    heartsBg.appendChild(h);
  }

  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const msg = document.getElementById('msg');
  const celebrate = document.getElementById('celebrate');

  const nudges = ["hmm, are you sure?","really? 🥺","give it another thought...","come onnn","last chance! 🐻","ok you're just teasing now"];

  let dodgeCount = 0;
  let yesScale = 1;

  function moveNoButton(){
    dodgeCount++;
    if(!noBtn.classList.contains('dodging')){
      const rect = noBtn.getBoundingClientRect();
      noBtn.classList.add('dodging');
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top = rect.top + 'px';
    }
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;
    const newX = Math.max(20, Math.random() * maxX);
    const newY = Math.max(20, Math.random() * maxY);
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    yesScale = Math.min(2.1, 1 + dodgeCount * 0.12);
    yesBtn.style.fontSize = (17 * yesScale) + 'px';
    yesBtn.style.padding = (16 * yesScale) + 'px ' + (30 * yesScale) + 'px';

    const noScale = Math.max(0.55, 1 - dodgeCount * 0.05);
    noBtn.style.fontSize = (17 * noScale) + 'px';
    noBtn.style.padding = (16 * noScale) + 'px ' + (30 * noScale) + 'px';

    msg.textContent = nudges[Math.min(dodgeCount - 1, nudges.length - 1)];
  }

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('click', (e) => { e.preventDefault(); moveNoButton(); });
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); }, {passive:false});

  function launchConfetti(){
    const emojis = ['🎉','💖','✨','🩷','💕','🎊'];
    for(let i=0;i<60;i++){
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      c.style.left = Math.random()*100 + 'vw';
      c.style.animationDuration = (2.5 + Math.random()*2) + 's';
      c.style.animationDelay = (Math.random()*0.6) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }

  yesBtn.addEventListener('click', () => {
    celebrate.classList.add('show');
    launchConfetti();
  });
</script>

</body>
</html>
